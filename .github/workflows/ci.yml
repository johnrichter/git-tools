# CI for git-tools: signing/rewrite, worktree/branch, merge/rebase, content-guardrail
# scans, installable git hooks, and the worktree-gate PreToolUse gate binary.
#
# guardrail gates every other job: SC-VERSIONING (tag-prefix.sh, tag pushes only) and
# SC-DISTRIBUTION (no-committed-binaries.sh, every run) -- see release/guard/README.md.
#
# surface-hygiene (SC10/SC11) and the pinned-digest checks in `go test` (part of
# build-test) both run on every push and pull_request, unconditionally -- neither
# guard is gated on an environment variable, a sibling checkout, or a path that
# might not resolve.

name: CI

on:
  push:
    branches: [main]
    # A release tag (vX.Y.Z) fires the workflow so tag-prefix.sh runs at tag-push time.
    tags: ['*']
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  guardrail:
    name: guardrail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: No committed binaries (SC-DISTRIBUTION)
        run: bash release/guard/no-committed-binaries.sh .

      - name: Tag conforms to SC-VERSIONING
        if: startsWith(github.ref, 'refs/tags/')
        run: bash release/guard/tag-prefix.sh "${GITHUB_REF_NAME}"

  build-test:
    name: build-test
    runs-on: ubuntu-latest
    needs: guardrail
    defaults:
      run:
        working-directory: git-tools
    steps:
      - uses: actions/checkout@v5
        with:
          path: git-tools

      - uses: actions/setup-go@v5
        with:
          go-version-file: git-tools/go.mod

      - name: gofmt --check
        run: |
          fmt_diff="$(gofmt -l .)"
          if [ -n "$fmt_diff" ]; then
            echo "$fmt_diff"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: |
          go build -trimpath -ldflags='-s -w' -o /dev/null ./cmd/git-tools
          go build -trimpath -ldflags='-s -w' -o /dev/null ./worktree-gate/detect/cmd/worktree-gate

      # The merge verb's signing gate is only meaningful against real
      # signatures, so this step proves the runner can make them and that the
      # gate's tests actually ran. It fails rather than skips: a skipped
      # signing test would silently drop the gate's coverage. The fixture signs
      # with git's ssh format over a per-test ephemeral key, so the only
      # provisioning a runner needs is ssh-keygen -- no keyring, no network,
      # and no repository secret.
      #
      # -count=1 is load-bearing for the "can make them" half: setup-go
      # restores the Go build cache, which holds test results too, so without
      # it a green result from an earlier runner is replayed verbatim and the
      # fixture never signs anything on this one.
      - name: Commit-signing fixture runs (merge signing gate)
        run: |
          command -v ssh-keygen
          if ! out="$(go test ./internal/cli -run TestMerge -count=1 -v 2>&1)"; then
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -q -- '--- SKIP'; then
            echo "a merge signing test skipped; the signing fixture must run in CI" >&2
            exit 1
          fi

      - name: go test
        run: go test ./...

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    needs: guardrail
    steps:
      - uses: actions/checkout@v5
        with:
          path: git-tools

      - uses: actions/setup-go@v5
        with:
          go-version-file: git-tools/go.mod

      - uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: v2.12.2
          working-directory: git-tools

  surface-hygiene:
    name: surface-hygiene
    runs-on: ubuntu-latest
    needs: guardrail
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck scripts/surface-hygiene.sh (SC-SH-LINT)
        run: shellcheck scripts/surface-hygiene.sh

      - name: SC10/SC11 surface hygiene (whole repo)
        run: bash scripts/surface-hygiene.sh
