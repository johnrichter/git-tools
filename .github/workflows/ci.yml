# CI for git-tools: signing/rewrite, worktree/branch, merge/rebase, content-guardrail
# scans, installable git hooks, and the worktree-gate PreToolUse gate binary.
#
# build-test's first two steps enforce SC-VERSIONING on a tag push: they install the
# pinned language-tools release (CONTRACT-CI-LT-INSTALL) and run its own `tag validate`
# subcommand against ${GITHUB_REF_NAME}. SC-DISTRIBUTION's committed-binary check has no
# CI replacement -- `scan lfs` already covers it at commit time and at each governed write (R7).
#
# surface-hygiene (SC10/SC11) and the pinned-digest checks in `go test` (part of
# build-test) both run on every push and pull_request, unconditionally -- neither
# guard is gated on an environment variable, a sibling checkout, or a path that
# might not resolve.

name: CI

on:
  push:
    branches: [main]
    # A release tag (vX.Y.Z) fires the workflow so language-tools tag validate runs at tag-push time.
    tags: ['*']
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: git-tools
    steps:
      - uses: actions/checkout@v5
        with:
          path: git-tools

      # Installs language-tools 2.1.0 from its own published GitHub release,
      # verifying the downloaded archive's sha256 against that release's own
      # checksums.txt and failing closed on a mismatch (CONTRACT-CI-LT-INSTALL).
      # Runs only on a tag push, the same condition as the tag-validate step it
      # feeds, so a pull-request run downloads nothing.
      - name: Install language-tools (pinned release)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          LANGUAGE_TOOLS_VERSION: "2.1.0"
          LANGUAGE_TOOLS_REPO: johnrichter/language-tools
        run: |
          set -euo pipefail
          archive="language-tools_${LANGUAGE_TOOLS_VERSION}_linux_amd64.tar.gz"
          base_url="https://github.com/${LANGUAGE_TOOLS_REPO}/releases/download/v${LANGUAGE_TOOLS_VERSION}"
          curl -fsSL -o "${archive}" "${base_url}/${archive}"
          curl -fsSL -o checksums.txt "${base_url}/checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf "${archive}" -C "${HOME}/.local/bin" language-tools
          chmod +x "${HOME}/.local/bin/language-tools"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          rm -f "${archive}" checksums.txt

      - name: Tag conforms to SC-VERSIONING
        if: startsWith(github.ref, 'refs/tags/')
        run: language-tools tag validate "${GITHUB_REF_NAME}" --module .

      - uses: actions/setup-go@v5
        with:
          go-version-file: git-tools/go.mod

      - name: gofmt --check
        run: |
          fmt_diff="$(gofmt -l .)"
          if [ -n "$fmt_diff" ]; then
            echo "$fmt_diff"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: |
          go build -trimpath -ldflags='-s -w' -o /dev/null ./cmd/git-tools
          go build -trimpath -ldflags='-s -w' -o /dev/null ./worktree-gate/detect/cmd/worktree-gate

      # The merge verb's signing gate is only meaningful against real
      # signatures, so this step proves the runner can make them and that the
      # gate's tests actually ran. It fails rather than skips: a skipped
      # signing test would silently drop the gate's coverage. The fixture signs
      # with git's ssh format over a per-test ephemeral key, so the only
      # provisioning a runner needs is ssh-keygen -- no keyring, no network,
      # and no repository secret.
      #
      # -count=1 is load-bearing for the "can make them" half: setup-go
      # restores the Go build cache, which holds test results too, so without
      # it a green result from an earlier runner is replayed verbatim and the
      # fixture never signs anything on this one.
      - name: Commit-signing fixture runs (merge signing gate)
        run: |
          command -v ssh-keygen
          if ! out="$(go test ./internal/cli -run TestMerge -count=1 -v 2>&1)"; then
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -q -- '--- SKIP'; then
            echo "a merge signing test skipped; the signing fixture must run in CI" >&2
            exit 1
          fi

      # internal/cli runs the git-tools binary end-to-end per test case, so its
      # wall time grows with every verb test added. History: 322s at the M3
      # baseline, 651s on 2026-08-13 -- already past Go's 600s per-package
      # default, so a bare `go test ./...` failed on timeout alone, which this
      # explicit budget restores. FB18's first half is now done: the binary is
      # built once per package run, not per test case (see buildCLI in
      # internal/cli/integration_test.go), which cut the package to ~390s of
      # CPU time. FB18's second half -- failing the gate on a runtime budget --
      # is still open, so this budget still does not bound the growth.
      - name: go test
        run: go test -timeout 20m ./...

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: git-tools

      - uses: actions/setup-go@v5
        with:
          go-version-file: git-tools/go.mod

      - uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: v2.12.2
          working-directory: git-tools

  surface-hygiene:
    name: surface-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck scripts/*.sh (SC-SH-LINT)
        run: shellcheck scripts/*.sh

      - name: SC10/SC11 surface hygiene (whole repo)
        run: bash scripts/surface-hygiene.sh
