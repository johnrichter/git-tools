# CI for git-tools: signing/rewrite, worktree/branch, merge/rebase, content-guardrail
# scans, installable git hooks, and the worktree-gate PreToolUse gate binary.
#
# guardrail gates every other job: SC-VERSIONING (tag-prefix.sh, tag pushes only) and
# SC-DISTRIBUTION (no-committed-binaries.sh, every run) -- see release/guard/README.md.
#
# surface-hygiene (SC10/SC11) and the pinned-digest checks in `go test` (part of
# build-test) both run on every push and pull_request, unconditionally -- neither
# guard is gated on an environment variable, a sibling checkout, or a path that
# might not resolve.

name: CI

on:
  push:
    branches: [main]
    # A release tag (vX.Y.Z) fires the workflow so tag-prefix.sh runs at tag-push time.
    tags: ['*']
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  guardrail:
    name: guardrail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: No committed binaries (SC-DISTRIBUTION)
        run: bash release/guard/no-committed-binaries.sh .

      - name: Tag conforms to SC-VERSIONING
        if: startsWith(github.ref, 'refs/tags/')
        run: bash release/guard/tag-prefix.sh "${GITHUB_REF_NAME}"

  build-test:
    name: build-test
    runs-on: ubuntu-latest
    needs: guardrail
    defaults:
      run:
        working-directory: git-tools
    steps:
      - uses: actions/checkout@v5
        with:
          path: git-tools

      - uses: actions/setup-go@v5
        with:
          go-version-file: git-tools/go.mod

      - name: gofmt --check
        run: |
          fmt_diff="$(gofmt -l .)"
          if [ -n "$fmt_diff" ]; then
            echo "$fmt_diff"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: |
          go build -trimpath -ldflags='-s -w' -o /dev/null ./cmd/git-tools
          go build -trimpath -ldflags='-s -w' -o /dev/null ./worktree-gate/detect/cmd/worktree-gate

      - name: go test
        run: go test ./...

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    needs: guardrail
    steps:
      - uses: actions/checkout@v5
        with:
          path: git-tools

      - uses: actions/setup-go@v5
        with:
          go-version-file: git-tools/go.mod

      - uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: v2.12.2
          working-directory: git-tools

  surface-hygiene:
    name: surface-hygiene
    runs-on: ubuntu-latest
    needs: guardrail
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck scripts/surface-hygiene.sh (SC-SH-LINT)
        run: shellcheck scripts/surface-hygiene.sh

      - name: SC10/SC11 surface hygiene (whole repo)
        run: bash scripts/surface-hygiene.sh
