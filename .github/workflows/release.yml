# SC-DISTRIBUTION release: git-tools cross-compiles both of its binaries -- the git-tools
# CLI itself and the worktree-gate PreToolUse hook -- into per-OS/arch archives + checksums
# and publishes them as the tag's official GitHub release. No matrix of runners is needed --
# Go's cross-compilation builds every GOOS/GOARCH cell from one Linux host.
#
# Triggers on a vX.Y.Z tag push (SC-VERSIONING: tag prefix == module path from repo root,
# which is empty for this single, root-level module; build-test's own tag-validate step enforces this
# in ci.yml on the same push). A manual workflow_dispatch run defaults to dry_run: true, so a
# change to this file can be exercised without cutting a tag or touching GitHub Releases.
#
# This workflow validates the tag itself rather than trusting ci.yml's build-test job: a
# tag push fires both workflows independently, and neither GitHub Actions run gates the
# other, so a malformed tag rejected by ci.yml would otherwise still reach `gh release
# create` here undisturbed.
#
# All build output is written under $RUNNER_TEMP, never inside the checkout. Go's build info
# reports vcs.modified=true whenever `git status --porcelain` is non-empty at build time, and an
# untracked directory of freshly built archives inside the checkout is exactly the kind of change
# that flags. Writing artifacts to $RUNNER_TEMP instead keeps the checkout byte-for-byte what was
# fetched, so every published binary's runtime/debug.ReadBuildInfo() reports vcs.modified=false
# against the tagged commit. Do not reintroduce an in-checkout artifact directory here.

name: SC-DISTRIBUTION release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build archives + checksums; skip the platform release."
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-publish:
    name: build-and-publish
    runs-on: ubuntu-latest
    env:
      # Pins the exact toolchain patch for this job's builds, overriding whatever
      # setup-go's go-version-file input would otherwise resolve from go.mod's
      # unpinned "go 1.26" directive (go.mod itself carries no toolchain line).
      GOTOOLCHAIN: go1.26.5
    defaults:
      run:
        working-directory: git-tools
    steps:
      - uses: actions/checkout@v5
        with:
          path: git-tools

      # Resolves the artifacts dir under $RUNNER_TEMP -- outside the checkout (git-tools/)
      # so no build step's output can dirty `git status --porcelain` and flip the published
      # binaries' vcs.modified stamp. Set via $GITHUB_ENV because the runner context is not
      # available to jobs.<id>.env; $RUNNER_TEMP is exported into every run step's shell.
      - name: Resolve artifacts directory
        run: |
          set -euo pipefail
          echo "ARTIFACTS_DIR=${RUNNER_TEMP}/release-artifacts" >> "$GITHUB_ENV"

      # Installs language-tools 2.1.0 from its own published GitHub release,
      # verifying the downloaded archive's sha256 against that release's own
      # checksums.txt and failing closed on a mismatch (CONTRACT-CI-LT-INSTALL).
      # Runs only on a tag push, the same condition as the tag-validate step it
      # feeds, so a workflow_dispatch run downloads nothing.
      - name: Install language-tools (pinned release)
        if: ${{ github.event_name == 'push' }}
        env:
          LANGUAGE_TOOLS_VERSION: "2.1.0"
          LANGUAGE_TOOLS_REPO: johnrichter/language-tools
        run: |
          set -euo pipefail
          archive="language-tools_${LANGUAGE_TOOLS_VERSION}_linux_amd64.tar.gz"
          base_url="https://github.com/${LANGUAGE_TOOLS_REPO}/releases/download/v${LANGUAGE_TOOLS_VERSION}"
          curl -fsSL -o "${archive}" "${base_url}/${archive}"
          curl -fsSL -o checksums.txt "${base_url}/checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf "${archive}" -C "${HOME}/.local/bin" language-tools
          chmod +x "${HOME}/.local/bin/language-tools"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          rm -f "${archive}" checksums.txt

      - name: Tag conforms to SC-VERSIONING
        if: ${{ github.event_name == 'push' }}
        run: language-tools tag validate "${GITHUB_REF_NAME}" --module .

      - uses: actions/setup-go@v5
        with:
          go-version-file: git-tools/go.mod

      # A tag push names the release directly; a manual dispatch has no tag, so it
      # synthesizes one for the archive filenames only -- dry_run always skips the
      # publish step below, so that placeholder never reaches a real release.
      - name: Resolve release tag + version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v0.0.0-dryrun.${GITHUB_RUN_ID}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # Go's cross-compilation needs no native hardware per target -- every cell of this
      # matrix builds from the one Linux runner. Both binaries ship under the one tag/version:
      # worktree-gate is a second entry point in this same module, not a separately versioned
      # component.
      #
      # binary-checksums.txt hashes the extracted binary itself (not the archive), so a
      # consumer can verify a binary already unpacked from its tarball. That hash has to be
      # taken here, inside the loop, because workdir -- and the binary in it -- is removed
      # before the loop ends.
      - name: Cross-compile per-OS/arch archives + checksums
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p "$ARTIFACTS_DIR"
          binary_checksums="$(mktemp)"
          for entry in "git-tools:./cmd/git-tools" "worktree-gate:./worktree-gate/detect/cmd/worktree-gate"; do
            bin="${entry%%:*}"
            pkg="${entry#*:}"
            for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
              os="${target%/*}"
              arch="${target#*/}"
              workdir="$(mktemp -d)"
              GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "${workdir}/${bin}" "${pkg}"
              key="${bin}_${version}_${os}_${arch}"
              sha256sum "${workdir}/${bin}" | awk -v key="${key}" '{ print $1, key }' OFS='  ' >> "${binary_checksums}"
              archive="${ARTIFACTS_DIR}/${bin}_${version}_${os}_${arch}.tar.gz"
              tar -czf "${archive}" -C "${workdir}" "${bin}"
              rm -rf "${workdir}"
            done
          done
          sort -k2 "${binary_checksums}" > "${ARTIFACTS_DIR}/binary-checksums.txt"
          rm -f "${binary_checksums}"
          ( cd "${ARTIFACTS_DIR}" && sha256sum ./*.tar.gz | sed 's#\./##' | sort -k2 > checksums.txt )
          ls -la "${ARTIFACTS_DIR}"

      # Confirms the build step above never wrote into the checkout: an untracked
      # leftover here would flip vcs.modified on every binary built from this point
      # on, so this fails the job outright rather than letting the stamp lie.
      - name: Checkout still clean after cross-compile
        run: |
          set -euo pipefail
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            echo "cross-compile step wrote into the checkout; artifacts must land under \$RUNNER_TEMP" >&2
            printf '%s\n' "$status"
            exit 1
          fi

      # The canonical sha256 of each SC-CONTRACT-DIGESTS artifact, so a consumer can verify
      # the exact contract data this release's worktree-gate binary was built against without
      # cloning the repo. Keyed by the same relative path the pinned-digest test uses.
      - name: Canonical sha256 of the SC-CONTRACT-DIGESTS artifacts
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACTS_DIR"
          ( cd worktree-gate/detect && sha256sum \
              testdata/cwd-corpus.json \
              contracts/connectors.json \
              contracts/banned-names.json \
            | sort -k2 ) > "${ARTIFACTS_DIR}/contract-digests.txt"
          cat "${ARTIFACTS_DIR}/contract-digests.txt"

      # Same guard as after the cross-compile step, repeated because this step also
      # writes an artifact and could just as easily dirty the checkout on its own.
      - name: Checkout still clean after contract-digest step
        run: |
          set -euo pipefail
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            echo "contract-digest step wrote into the checkout; artifacts must land under \$RUNNER_TEMP" >&2
            printf '%s\n' "$status"
            exit 1
          fi

      - name: Publish the official release (per-OS/arch archives + checksums)
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" --title "${{ steps.version.outputs.tag }}" --generate-notes \
            "${ARTIFACTS_DIR}"/*.tar.gz \
            "${ARTIFACTS_DIR}/checksums.txt" \
            "${ARTIFACTS_DIR}/binary-checksums.txt" \
            "${ARTIFACTS_DIR}/contract-digests.txt"

      - name: Dry-run summary
        if: ${{ github.event_name != 'push' }}
        run: |
          set -euo pipefail
          echo "dry-run: built archives + checksums for ${{ steps.version.outputs.tag }} - publish skipped"
          ls -la "${ARTIFACTS_DIR}"
